<!-- Global Navbar -->
<nav class="global-navbar" *ngIf="!isViewerMode">
  <div class="brand" routerLink="/dashboard" style="cursor: pointer;" title="Back to Dashboard">
    <mat-icon>dynamic_form</mat-icon>
    <span class="app-title">FormBuilder Pro</span>
  </div>
  
  <div class="spacer" style="flex: 1;"></div>

  <div class="nav-links" *ngIf="authService.currentUser()">
    <button class="api-docs" (click)="getApiDocs()" title="API Documentation"><mat-icon>api</mat-icon></button>
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Dashboard</a>
  </div>

  <div class="user-profile" *ngIf="authService.currentUser()">
    <div class="profile-clickable" routerLink="/profile" routerLinkActive="active" title="Click to view & edit profile">
      <div class="avatar">
        <img *ngIf="authService.currentUser()?.['profileImage']" [src]="authService.currentUser()?.['profileImage']" alt="Profile">
        <mat-icon *ngIf="!authService.currentUser()?.['profileImage']">person</mat-icon>
      </div>
      <div class="user-meta">
        <span class="user-greeting">Welcome,</span>
        <span class="user-name">{{ authService.currentUser()?.['username'] }}</span>
      </div>
      <mat-icon class="profile-chevron">chevron_right</mat-icon>
    </div>

    <button class="logout-btn" (click)="logout()" title="Logout">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  </div>
</nav>
