<div class="field-container" [formGroup]="group">
  <label [for]="field.name">{{ field.label }}<span *ngIf="field.required" class="req">*</span></label>
  <select *ngIf="field.type === 'dropdown'" [id]="field.name" [formControlName]="field.name">
    <option [ngValue]="''" disabled>Select {{ field.label }}</option>
    <option *ngFor="let option of field.options" [ngValue]="option.value || option.label || option">{{ option.label ||
      option }}</option>
  </select>
  <select *ngIf="field.type === 'multiselect'" [id]="field.name" [formControlName]="field.name" multiple>
    <option *ngFor="let option of field.options" [ngValue]="option.value || option.label || option">{{ option.label ||
      option }}</option>
  </select>
  <div class="error-msg" *ngIf="group.get(field.name)?.touched && group.get(field.name)?.invalid"><span
      *ngIf="group.get(field.name)?.errors?.['required']">{{field.label}} is required.</span></div>
</div>
