<div class="field-container" [formGroup]="group">
  <label [for]="field.name">{{ field.label }}<span *ngIf="field.required" class="req">*</span></label>
  <div class="upload-wrapper" [class.dragging]="isDragging" (dragover)="onDragOver($event)" (dragleave)="onDragLeave()" (drop)="onDrop($event)">
    <input #fileInput type="file" [id]="field.name" (change)="onFileSelected($event)" style="display: none;" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.gif">
    <div class="upload-area" (click)="fileInput.click()" *ngIf="!uploadedUrl && !isUploading"><mat-icon class="upload-icon">cloud_upload</mat-icon><span class="upload-text">Drag & drop your file here, or <span class="browse">browse</span></span><span class="upload-hint">Supports: PDF, Doc, Excel, Images (Max 10MB)</span></div>
    <div class="uploading-state" *ngIf="isUploading"><div class="spinner"></div><span>Uploading {{ selectedFilename }}...</span></div>
    <div class="uploaded-state" *ngIf="uploadedUrl"><mat-icon class="file-success-icon">check_circle</mat-icon><div class="file-info"><span class="file-name" [title]="selectedFilename">{{ selectedFilename }}</span><a [href]="getAbsoluteUrl(uploadedUrl)" target="_blank" class="view-link">View Uploaded File</a></div><button type="button" class="btn-icon remove-btn" (click)="removeFile()" title="Delete file"><mat-icon>close</mat-icon></button></div>
  </div>
  <div class="error-msg" *ngIf="group.get(field.name)?.touched && group.get(field.name)?.invalid"><span *ngIf="group.get(field.name)?.errors?.['required']">{{field.label}} is required.</span></div>
</div>
