<div class="field-container" [formGroup]="group">
  <label [for]="field.name">{{ field.label }}<span *ngIf="field.required" class="req">*</span></label>
  <ng-container [ngSwitch]="field.type">
    <textarea *ngSwitchCase="'textarea'" [id]="field.name" [formControlName]="field.name" [placeholder]="field.label?'Enter '+field.label:''" [maxlength]="field.max || null"></textarea>
    <ng-container *ngSwitchCase="'currency'"><div class="input-group"><span class="currency-symbol">{{ field.currency }}</span><input type="number" [id]="field.name" [formControlName]="field.name" [placeholder]="field.label?'Enter '+field.label:''" [min]="field.min || null" [max]="field.max || null" (input)="limitDecimal($event, field.precision)"></div></ng-container>
    <input *ngSwitchDefault [type]="getInputType(field.type)" [id]="field.name" [formControlName]="field.name" [placeholder]="field.label?'Enter '+field.label:''" [min]="field.min || null" [max]="field.max || null" (input)="limitDecimal($event, field.precision)">
  </ng-container>
  <div class="error-msg" *ngIf="group.get(field.name)?.touched && group.get(field.name)?.invalid">
    <span *ngIf="group.get(field.name)?.errors?.['required']">{{field.label}} is required.</span><span *ngIf="group.get(field.name)?.errors?.['email']">Invalid email format.</span><span *ngIf="group.get(field.name)?.errors?.['pattern']">{{ field.errorMessage || 'Invalid format.' }}</span><span *ngIf="group.get(field.name)?.errors?.['min']">Minimum is {{ field.min }}.</span><span *ngIf="group.get(field.name)?.errors?.['max']">Maximum is {{ field.max }}.</span>
  </div>
</div>
